name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Os testes rodam num PostgreSQL de verdade, igual ao da aplicação
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank -d bank_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes
        run: ./mvnw -B test
