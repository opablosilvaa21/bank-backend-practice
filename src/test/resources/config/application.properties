# Carregado POR CIMA de src/main/resources/application.properties (classpath:/config/ tem prioridade),
# então aqui só fica o que muda nos testes: o banco.
# H2 em memória até o passo 3 trazer um PostgreSQL de verdade para os testes.
# O modo PostgreSQL faz o H2 aceitar as mesmas migrations do Flyway.
spring.datasource.url=jdbc:h2:mem:bankdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
