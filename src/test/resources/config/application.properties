# Carregado POR CIMA de src/main/resources/application.properties (classpath:/config/ tem prioridade),
# então aqui só fica o que muda nos testes.

# Os testes usam um PostgreSQL de verdade, num banco separado (bank_test) para não mexer nos seus dados.
# No GitHub Actions o banco vem de um container de serviço (.github/workflows/ci.yml).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/bank_test}
spring.datasource.username=${TEST_DB_USERNAME:bank}
spring.datasource.password=${TEST_DB_PASSWORD:bank}

# Cada contexto de teste apaga e recria o schema (TestDatabaseConfig). Nunca habilite isso fora dos testes.
spring.flyway.clean-disabled=false
