# Carregado POR CIMA de src/main/resources/application.properties (classpath:/config/ tem prioridade),
# então aqui só fica o que muda nos testes: o banco.
# H2 em memória até o Testcontainers (passo 3) trazer um PostgreSQL de verdade para os testes.
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
