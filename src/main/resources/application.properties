spring.application.name=bank-backend-practice
server.port=8080

# PostgreSQL do compose.yaml (docker compose up -d). Os valores padrão batem com o Compose;
# em outro ambiente, troque pelas variáveis DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank}
spring.datasource.username=${DB_USERNAME:bank}
spring.datasource.password=${DB_PASSWORD:bank}
# Quem cria e altera as tabelas é o Flyway (db/migration). O Hibernate só confere se as entidades
# batem com o banco e, se não baterem, a aplicação nem sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paginação: limita o tamanho de página pedido pelo cliente
spring.data.web.pageable.max-page-size=100
# Page vira {"content": [...], "page": {...}}: formato JSON estável recomendado pelo Spring Data
spring.data.web.pageable.serialization-mode=via-dto

# Base fictícia gerada ao subir a aplicação (config/DemoData.java)
bank.demo.enabled=true
bank.demo.customers=97
bank.demo.seed=42

# Front-end (resources/static): o navegador confere com o servidor antes de reaproveitar o cache,
# para nunca rodar uma versão antiga do JavaScript ou do CSS
spring.web.resources.cache.cachecontrol.no-cache=true
