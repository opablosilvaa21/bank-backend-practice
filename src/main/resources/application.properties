spring.application.name=bank-backend-practice
server.port=8080
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Paginação: limita o tamanho de página pedido pelo cliente
spring.data.web.pageable.max-page-size=100
# Page vira {"content": [...], "page": {...}}: formato JSON estável recomendado pelo Spring Data
spring.data.web.pageable.serialization-mode=via-dto

# Base fictícia gerada ao subir a aplicação (config/DemoData.java)
bank.demo.enabled=true
bank.demo.customers=97
bank.demo.seed=42

# Front-end (resources/static): o navegador confere com o servidor antes de reaproveitar o cache,
# para nunca rodar uma versão antiga do JavaScript ou do CSS
spring.web.resources.cache.cachecontrol.no-cache=true
