spring.application.name=bank-backend-practice
server.port=8080

# PostgreSQL do compose.yaml (docker compose up -d). Os valores padrão batem com o Compose;
# em outro ambiente, troque pelas variáveis DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank}
spring.datasource.username=${DB_USERNAME:bank}
spring.datasource.password=${DB_PASSWORD:bank}
# Quem cria e altera as tabelas é o Flyway (db/migration). O Hibernate só confere se as entidades
# batem com o banco e, se não baterem, a aplicação nem sobe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Paginação: limita o tamanho de página pedido pelo cliente
spring.data.web.pageable.max-page-size=100
# Page vira {"content": [...], "page": {...}}: formato JSON estável recomendado pelo Spring Data
spring.data.web.pageable.serialization-mode=via-dto

# Base fictícia gerada ao subir a aplicação (config/DemoData.java)
bank.demo.enabled=true
bank.demo.customers=97
bank.demo.seed=42

# Front-end (resources/static): o navegador confere com o servidor antes de reaproveitar o cache,
# para nunca rodar uma versão antiga do JavaScript ou do CSS
spring.web.resources.cache.cachecontrol.no-cache=true

# Pool do @Async (notificações): ao desligar, termina o que está na fila em vez de descartar
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# Mensageria (Kafka). Desligada por padrão: a aplicação sobe sem Kafka e as notificações saem direto
# do evento (TransferNotificationListener). Ligada, o caminho é outbox -> Kafka -> consumidor.
bank.messaging.enabled=${BANK_MESSAGING_ENABLED:false}
bank.messaging.partitions=3
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Com o Kafka fora do ar, o envio falha em segundos (em vez de travar 60 s) e o evento fica no outbox
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=bank-notifications
# Um grupo novo lê o tópico desde o início, sem perder eventos publicados antes de ele subir
spring.kafka.consumer.auto-offset-reset=earliest
